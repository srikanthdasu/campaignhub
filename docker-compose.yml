services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: campaignhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campaignhub}
      POSTGRES_DB: campaignhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
