name: Build and deploy to Azure Web App - campaignhub-app2

on:
  push:
    branches:
      # main is stale/diverged from the branch actually deployed to production — leaving it
      # here meant a stray push there would silently roll prod back to months-old code.
      - rebuild
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # TEST-3: the scheduler RBAC e2e suite (test/scheduler-rbac.e2e-spec.ts) is the only
    # authorization regression test in the repo and previously never ran in CI — it could break
    # silently and the product would still deploy. This service container gives it a real,
    # ephemeral Postgres instance, entirely separate from the production DATABASE_URL secret used
    # by the later "Apply database migrations" step.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: campaignhub
          POSTGRES_PASSWORD: campaignhub
          POSTGRES_DB: campaignhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install backend dependencies
        working-directory: backend
        # --legacy-peer-deps: @nestjs/throttler hasn't published a peer range covering
        # @nestjs/core ^12 yet, even though it works fine at runtime against it.
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      # TEST-1: runs the unit suite with coverage enforcement — vitest.config.ts's
      # `coverage.thresholds` (set just under the baseline measured when this was added) fails
      # the build on a real regression, not just on a failing assertion.
      - name: Run backend tests (with coverage threshold)
        working-directory: backend
        run: npm run test:cov

      # Applies the schema to the ephemeral CI Postgres service above, not production — the e2e
      # suite below (AppModule booted for real, real HTTP requests via supertest) needs real
      # tables to write to.
      - name: Apply migrations to the test database
        working-directory: backend
        env:
          DATABASE_URL: postgresql://campaignhub:campaignhub@localhost:5432/campaignhub_test
        run: npx prisma migrate deploy

      # Exercises real guard/decorator behavior (@Roles, @UseGuards) that a service-only unit
      # test can't observe — see scheduler-rbac.e2e-spec.ts's own comment. Every value below is a
      # disposable placeholder for a throwaway CI database; none are read from repo secrets
      # because none of the AppModule routes this suite actually calls (auth, clients, users,
      # content, scheduler) touch Razorpay/OAuth/Azure AI, so only DB/JWT/app-URL need to be real
      # enough to satisfy config validation and JwtStrategy's constructor-time getOrThrow.
      - name: Run backend e2e tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://campaignhub:campaignhub@localhost:5432/campaignhub_test
          JWT_ACCESS_SECRET: ci-test-only-access-secret-not-for-production-use
          JWT_REFRESH_SECRET: ci-test-only-refresh-secret-not-for-production-use
          TOKEN_ENCRYPTION_KEY: ci-test-only-encryption-key-not-for-production
          PUBLIC_APP_URL: http://localhost:3000
        run: npm run test:e2e

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        env:
          # Baked into the client bundle at build time — the combined server (below) mounts
          # the API under /api on the same origin/port as the frontend in production, so this
          # is a same-origin relative path, not the separate-port URL local dev uses.
          NEXT_PUBLIC_API_URL: /api
          # Same OAuth Client ID as the backend's GOOGLE_CLIENT_ID App Service setting — a public
          # identifier by design (not a secret), so it's fine directly in the workflow rather
          # than needing its own GitHub secret. Without this at build time, GoogleSignInButton
          # silently renders nothing (no error) since NEXT_PUBLIC_* vars are inlined at build,
          # not read at request time — that's exactly what happened on the first deploy attempt.
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: 447671100716-bgejntbph1ki9pud5l1b25sqpdign9fv.apps.googleusercontent.com
          # Same reasoning as GOOGLE_CLIENT_ID above — a DSN is a public-safe identifier (only
          # lets events be sent, not read), so it's fine directly here rather than as a secret.
          NEXT_PUBLIC_SENTRY_DSN: https://87ac69a4b882b6fe1a57ecb8ae7bf2b9@o4512129443102720.ingest.de.sentry.io/4512130113273936
        run: npm run build

      # Runs only after both builds have already succeeded — applying a migration ahead of an
      # unbuildable release is exactly the failure mode that caused the "No clients yet" incident
      # this step originally fixed. Stays in this job (rather than the deploy job) because that's
      # the only job with the schema/migrations source checked out and the Prisma CLI installed;
      # moving it there would mean re-checking-out and re-installing for no real benefit, since
      # `needs: build` already blocks deploy on this job's success either way.
      - name: Apply database migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy

      # devDependencies (vitest, the Nest CLI, TypeScript, eslint, type declarations, ...) are
      # needed to run the tests/builds above but never touched by `node dist/main.js` or `next
      # start` at runtime — pruning here, after both are done, is what actually shrinks what ships.
      # Backend needs --legacy-peer-deps for the same reason `npm ci` above does: `npm prune` does
      # its own peer-dependency resolution too, not just removal, and hits the identical
      # @nestjs/throttler ERESOLVE conflict (confirmed by actually running it, not assumed).
      - name: Prune dev dependencies before staging
        run: |
          cd backend && npm prune --omit=dev --legacy-peer-deps
          cd ../frontend && npm prune --omit=dev

      - name: Stage deployment package
        run: |
          mkdir -p deploy/backend deploy/frontend
          cp -r backend/dist deploy/backend/dist
          # .d.ts/.js.map are tsconfig's dev-time declaration/source-map output — nothing in the
          # app registers source-map-support, so the maps were never even wired up to improve a
          # production stack trace, and the declarations have no runtime use at all.
          find deploy/backend/dist -name '*.d.ts' -delete
          find deploy/backend/dist -name '*.js.map' -delete
          cp -r backend/node_modules deploy/backend/node_modules
          cp backend/package.json deploy/backend/package.json
          mkdir -p deploy/backend/uploads
          cp -r frontend/build-output deploy/frontend/build-output
          cp -r frontend/node_modules deploy/frontend/node_modules
          cp -r frontend/public deploy/frontend/public
          cp frontend/package.json deploy/frontend/package.json
          cp frontend/next.config.ts deploy/frontend/next.config.ts

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
      - uses: azure/webapps-deploy@v3
        with:
          app-name: 'campaignhub-app2'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
