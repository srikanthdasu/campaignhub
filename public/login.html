<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampaignHub AI - Login</title>

<style>
body{
font-family:Arial;
background:#f4f6fb;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.card{
width:400px;
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 0 20px rgba(0,0,0,.15);
}

input{
width:100%;
padding:12px;
margin:10px 0;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
background:#2563eb;
color:white;
border:none;
font-size:18px;
cursor:pointer;
border-radius:8px;
}

button:hover{
background:#1d4ed8;
}

h2{
text-align:center;
}

#msg{
margin-top:15px;
font-weight:bold;
text-align:center;
}
</style>

</head>

<body>

<div class="card">

<h2>CampaignHub AI Login</h2>

<input id="email" type="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">

<button onclick="login()">
Login
</button>

<p id="msg"></p>

</div>

<script>

async function login(){

    const email=document.getElementById("email").value;
    const password=document.getElementById("password").value;

    const response=await fetch("/auth/login",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            email,
            password
        })

    });

    const data=await response.json();

    document.getElementById("msg").innerText=data.message;

    if(data.success){

        // Save logged-in user
        localStorage.setItem(
            "user",
            JSON.stringify(data.user)
        );

        // Redirect to dashboard
        window.location="/dashboard.html";

    }

}

</script>

</body>
</html>
