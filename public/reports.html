<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampaignHub AI - Reports</title>

    <link rel="stylesheet" href="css/reports.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="container">

    <h1>📊 CampaignHub Reports</h1>

    <div class="report-box">

        <button onclick="downloadCaptionsPDF()">
            <i class="fa-solid fa-file-pdf"></i>
            Export Captions PDF
        </button>

        <button onclick="downloadCaptionsExcel()">
            <i class="fa-solid fa-file-excel"></i>
            Export Captions Excel
        </button>

        <button onclick="downloadSchedulerPDF()">
            <i class="fa-solid fa-calendar-days"></i>
            Export Scheduler PDF
        </button>

        <button onclick="downloadSchedulerExcel()">
            <i class="fa-solid fa-table"></i>
            Export Scheduler Excel
        </button>

        <button onclick="window.location.href='dashboard.html'">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Dashboard
        </button>

    </div>

</div>

<script src="js/reports.js"></script>

</body>
</html>
